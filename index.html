function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function commonsURL(query,width=700){return `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=${width}&format=json&origin=*`}
const imgCache=JSON.parse(localStorage.getItem('parisImgCache')||'{}');
let imgQueue=[],running=0;
function queueImage(img,query){if(!img||!query)return;if(imgCache[query]){img.src=imgCache[query];return}imgQueue.push({img,query});pumpImages()}
async function pumpImages(){while(running<4&&imgQueue.length){const job=imgQueue.shift();running++; try{let r=await fetch(commonsURL(job.query));let d=await r.json();let pages=d.query&&d.query.pages?Object.values(d.query.pages):[];let u=pages[0]?.imageinfo?.[0]?.thumburl||pages[0]?.imageinfo?.[0]?.url;if(u){imgCache[job.query]=u;localStorage.setItem('parisImgCache',JSON.stringify(imgCache));job.img.src=u}else job.img.closest('.imgbox')?.classList.add('failed')}catch(e){job.img.closest('.imgbox')?.classList.add('failed')}finally{running--;pumpImages()}}
}
function hydrateImages(root=document){root.querySelectorAll('img[data-query]').forEach(i=>queueImage(i,i.dataset.query));}
function nav(screen,area=null,push=true){state.screen=screen;state.area=area;window.scrollTo(0,0);render();const h=screen==='home'?'#home':screen==='paris'?'#paris':screen==='area'?`#area-${area}`:`#${screen}`; if(push)history.pushState({screen,area},'',h); else history.replaceState({screen,area},'',h)}
function header(title,leftAction='home',rightAction='home',leftIcon='back',rightIcon='home'){
 const back=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
 const home=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`;
 return `<div class="plain-head"><a class="iconbtn" href="#" data-act="${leftAction}" aria-label="Back">${leftIcon==='home'?home:back}</a><div class="title">${esc(title)}</div><a class="iconbtn" href="#" data-act="${rightAction}" aria-label="Home">${home}</a></div>`
}
function renderHome(){app.innerHTML=`<section class="screen active" id="screen-home"><div class="home-title">France 2026</div><div class="journey-stack">${DATA.homeCards.map(c=>`<a class="journey-card" href="#" data-home-card="${c.key}"><img data-query="${esc(c.query)}" alt=""><div class="journey-copy"><h2>${esc(c.title)}</h2><p>${esc(c.subtitle)}</p></div></a>`).join('')}</div></section>`;hydrateImages(app)}
const areaHotspots={loft:[68,78,20,18],latin:[76,45,21,20],'left-bank':[17,70,20,18],central:[42,22,23,20],west:[8,27,28,30],north:[34,0,33,22],marais:[46,59,18,18]};
function renderParis(){app.innerHTML=`<section class="screen active" id="screen-paris">${header('Welcome to Paris','home','home','back','home')}<div class="page"><div class="area-strip">${DATA.areas.filter(a=>a.slug!=='across').map(a=>`<a href="#" class="area-tile" data-area="${a.slug}"><div class="area-photo imgbox"><img data-query="${esc(a.rep)}" alt=""></div><span>${esc(a.title)}</span></a>`).join('')}</div><div class="map-card"><img src="${DATA.mapSrc}" alt="Illustrated map of Paris"><div class="map-overlays">${Object.entries(areaHotspots).map(([slug,v])=>`<button class="map-hit" data-area="${slug}" aria-label="Open ${slug}" style="left:${v[0]}%;top:${v[1]}%;width:${v[2]}%;height:${v[3]}%"></button>`).join('')}</div></div><div class="base-card imgbox"><img data-query="Rue Saint-Hippolyte Paris" alt=""><div class="base-copy"><h3>Your Paris base</h3><p><b>22-25 August · 23 Rue Saint-Hippolyte.</b> The Loft sits just south of the Latin Quarter, with Mouffetard and the Left Bank naturally feeding into the sightseeing days.</p></div></div></div></section>`;hydrateImages(app)}
function compactDesc(s,max=205){s=String(s||'');if(s.length<=max)return s;let cut=s.slice(0,max);let p=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('; '));if(p>95)return cut.slice(0,p+1);let sp=cut.lastIndexOf(' ');return cut.slice(0,sp)+'…'}
function areaNav(current){return `<nav class="area-nav" aria-label="Other Paris areas">${DATA.areas.map(a=>`<button class="${a.slug===current?'active':''}" data-area="${a.slug}">${esc(a.title)}</button>`).join('')}</nav>`}
function firstItemByCat(area,cat){return area.items.find(x=>x.group===cat)}
function renderArea(slug){const a=DATA.areas.find(x=>x.slug===slug);if(!a)return nav('paris');let cats=DATA.catOrder.filter(c=>a.items.some(x=>x.group===c));if(!state.cat||!cats.includes(state.cat))state.cat=cats[0];let items=a.items.filter(x=>x.group===state.cat);app.innerHTML=`<section class="screen active">${header(a.title,'paris','home','back','home')}<div class="page area-page"><div class="cat-strip">${cats.map(c=>{let it=firstItemByCat(a,c);return `<button class="cat-tile ${c===state.cat?'active':''}" data-cat="${c}"><div class="cat-photo imgbox"><img data-query="${esc((it?.imageQuery)||a.rep)}" alt=""></div><span>${esc(DATA.catNames[c])}</span></button>`}).join('')}</div><div class="cards">${items.map((it,ix)=>renderPlace(it,ix)).join('')}</div></div>${areaNav(slug)}</section>`;hydrateImages(app)}
function renderPlace(it,ix){let query=esc(it.imageQuery), q2=esc(it.imageQuery+' exterior'), q3=esc(it.imageQuery+' detail');let pin=`<svg viewBox="0 0 24 24" fill="#e64545" aria-hidden="true"><path d="M12 22s7-6.05 7-13A7 7 0 1 0 5 9c0 6.95 7 13 7 13z"/><circle cx="12" cy="9" r="2.8" fill="white"/></svg>`;return `<article class="place-card"><div class="place-media imgbox"><img data-query="${query}" alt=""><img data-query="${q2}" alt=""><img data-query="${q3}" alt=""></div><div class="place-body"><div class="place-name-row"><a class="place-name" href="${it.website}" target="_blank" rel="noopener">${esc(it.name)}</a><a class="extlink ta" href="${it.ta}" target="_blank" rel="noopener" title="Tripadvisor"><img src="${TA_LOGO}" alt="Tripadvisor"></a><a class="extlink pin" href="${it.maps}" target="_blank" rel="noopener" title="Apple Maps">${pin}</a></div><div class="place-cat">${esc(it.category)}</div><div class="place-desc">${esc(compactDesc(it.desc))}</div><div class="place-meta"><span class="pill">${esc(it.time||'Flexible')}</span><span class="pill">${esc(it.bookingLabel)}</span></div></div></article>`}
function renderResources(){let core=['G7','TheFork','Citymapper','Île-de-France','Affluences'];let rs=DATA.resources.filter(r=>core.some(k=>r.name.toLowerCase().includes(k.toLowerCase()))); if(!rs.length)rs=[{name:'G7 Taxi',url:'https://www.g7.fr/'},{name:'TheFork',url:'https://www.thefork.com/'},{name:'Citymapper',url:'https://citymapper.com/paris'},{name:'Île-de-France Mobilités',url:'https://www.iledefrance-mobilites.fr/'},{name:'Affluences',url:'https://affluences.com/'}];app.innerHTML=`<section class="screen active">${header('Resources','home','home','‹','⌂')}<div class="page"><div class="resource-grid">${rs.map(r=>`<a class="resource-card" href="${r.url}" target="_blank"><b>${esc(r.name)}</b><span>Open app / website</span></a>`).join('')}</div></div></section>`}
function renderNormandy(){app.innerHTML=`<section class="screen active">${header('Normandy','home','home','‹','⌂')}<div class="page"><div class="blank">Normandy will use the same structure once we build its universe.</div></div></section>`}
function renderItinerary(){app.innerHTML=`<section class="screen active">${header('Itinerary','home','home','‹','⌂')}<div class="page"><div class="blank">Itinerary page reserved for the finished trip timetable.</div></div></section>`}
function render(){if(state.screen==='home')renderHome();else if(state.screen==='paris')renderParis();else if(state.screen==='area')renderArea(state.area);else if(state.screen==='resources')renderResources();else if(state.screen==='normandy')renderNormandy();else if(state.screen==='itinerary')renderItinerary()}
document.addEventListener('click',e=>{let a=e.target.closest('[data-act]');if(a){e.preventDefault();let act=a.dataset.act;if(act==='home')nav('home');else if(act==='back')history.back();else if(act==='paris')nav('paris');return}let hc=e.target.closest('[data-home-card]');if(hc){e.preventDefault();let k=hc.dataset.homeCard;nav(k==='paris'?'paris':k);return}let ar=e.target.closest('[data-area]');if(ar){e.preventDefault();nav('area',ar.dataset.area);return}let ct=e.target.closest('[data-cat]');if(ct){state.cat=ct.dataset.cat;renderArea(state.area);return}});
window.addEventListener('popstate',()=>{let h=location.hash;if(h.startsWith('#area-'))nav('area',h.slice(6),false);else if(h==='#paris')nav('paris',null,false);else if(h==='#resources')nav('resources',null,false);else if(h==='#normandy')nav('normandy',null,false);else if(h==='#itinerary')nav('itinerary',null,false);else nav('home',null,false)});
let h=location.hash;if(h.startsWith('#area-')){state.screen='area';state.area=h.slice(6)}else if(h==='#paris')state.screen='paris';else if(h==='#resources')state.screen='resources';else if(h==='#normandy')state.screen='normandy';else if(h==='#itinerary')state.screen='itinerary';render();
</script></body></html>
