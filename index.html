<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>France 2026</title>
<style>
:root{--bg:#eaf4fb;--card:#fff;--ink:#132233;--muted:#607384;--green:#187f5a;--line:#d7e5ef;--shadow:0 7px 22px rgba(35,72,95,.08);--radius:20px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,a{font:inherit}.screen{display:none;min-height:100vh}.screen.active{display:block}.page{max-width:1050px;margin:0 auto;padding:0 16px 38px}.plain-head{height:60px;position:sticky;top:0;z-index:70;background:rgba(234,244,251,.97);backdrop-filter:blur(15px);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;border-bottom:1px solid rgba(74,111,135,.10)}.plain-head .title{text-align:center;font-size:18px;font-weight:730;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.iconbtn{height:42px;width:42px;border:0;background:transparent;color:#284557;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:24px}.iconbtn svg{width:22px;height:22px}.iconbtn:active{background:rgba(255,255,255,.65)}
/* HOME - horizontal full-screen carousel */
.home-title{text-align:center;font-size:34px;font-weight:760;letter-spacing:-.8px;padding:28px 0 18px}.journey-stack{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 max(0px,calc((100vw - 1050px)/2)) 16px}.journey-stack::-webkit-scrollbar{display:none}.journey-card{position:relative;flex:0 0 min(820px,82vw);height:68vh;min-height:500px;border-radius:26px;overflow:hidden;background:#cfd9df;box-shadow:var(--shadow);text-decoration:none;color:#fff;scroll-snap-align:center}.journey-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.journey-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,17,28,.03),rgba(5,17,28,.62))}.journey-copy{position:absolute;left:28px;right:28px;bottom:26px;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.3)}.journey-copy h2{font-size:38px;margin:0 0 5px;letter-spacing:-.8px}.journey-copy p{margin:0;font-weight:650;font-size:17px}.journey-arrow{display:none}
/* PARIS MAP */
.area-strip,.cat-strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.area-strip::-webkit-scrollbar,.cat-strip::-webkit-scrollbar,.area-nav::-webkit-scrollbar{display:none}.area-tile{flex:0 0 108px;text-decoration:none;color:var(--ink)}.area-photo{height:62px;border-radius:15px;overflow:hidden;background:#dbe7ef;border:1px solid rgba(43,67,83,.06);box-shadow:0 4px 12px rgba(31,51,65,.06)}.area-photo img{width:100%;height:100%;object-fit:cover}.area-tile span{display:block;text-align:center;margin-top:5px;font-size:10px;font-weight:720;line-height:1.16}.map-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);position:relative}.map-card img{width:100%;display:block}.map-overlays{position:absolute;inset:0}.map-hit{position:absolute;background:transparent;border:0;border-radius:20px;cursor:pointer}.map-hit:focus-visible{outline:3px solid rgba(24,127,90,.5)}
.base-card{height:150px;position:relative;margin-top:11px;border-radius:20px;overflow:hidden;background:#b9cfde;box-shadow:var(--shadow);color:white}.base-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.base-card:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,29,43,.76),rgba(10,29,43,.28))}.base-copy{position:absolute;z-index:2;left:20px;right:18px;top:50%;transform:translateY(-50%);text-shadow:0 1px 6px rgba(0,0,0,.25)}.base-copy h3{margin:0 0 6px;font-size:21px;letter-spacing:-.3px}.base-copy p{margin:0;font-size:13px;line-height:1.42;max-width:620px}.base-copy b{font-weight:760}
/* AREA PAGES */
.area-page{max-width:900px;padding-bottom:86px}.cat-strip{position:sticky;top:60px;z-index:60;background:rgba(234,244,251,.97);backdrop-filter:blur(14px);padding-top:9px;padding-bottom:9px;border-bottom:1px solid rgba(74,111,135,.09)}.cat-tile{flex:0 0 96px;border:0;background:transparent;padding:0;cursor:pointer;text-align:center;color:var(--ink)}.cat-photo{height:58px;border-radius:14px;background:#dce7ef;overflow:hidden;border:2px solid transparent}.cat-photo img{width:100%;height:100%;object-fit:cover}.cat-tile span{display:block;margin-top:5px;font-size:9px;font-weight:720;line-height:1.12}.cat-tile.active .cat-photo{border-color:var(--green);box-shadow:0 0 0 3px rgba(24,127,90,.10)}.cat-tile.active span{color:var(--green)}.cards{display:grid;gap:10px;padding-top:10px}.place-card{background:#fff;border-radius:18px;box-shadow:0 6px 17px rgba(35,72,95,.07);overflow:hidden;display:grid;grid-template-columns:150px minmax(0,1fr);min-height:142px}.place-media{grid-column:1;grid-row:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#e8eef1;min-height:142px}.place-media img{width:100%;height:100%;object-fit:cover;display:block}.place-media img:first-child{grid-row:1/3}.place-body{grid-column:2;grid-row:1;padding:13px 14px}.place-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.place-name{font-size:17px;font-weight:770;color:#183f64;text-decoration:none;letter-spacing:-.12px}.extlink{height:27px;min-width:27px;padding:0 5px;border-radius:8px;background:#f2f6f9;color:#526878;display:inline-grid;place-items:center;text-decoration:none;font-size:12px;font-weight:800}.extlink.ta{padding:0;background:transparent}.extlink.ta img{width:26px;height:22px;object-fit:contain;border-radius:5px}.extlink.pin{background:transparent;padding:0}.extlink.pin svg{width:24px;height:24px;display:block}.place-cat{font-size:9px;color:var(--green);font-weight:820;letter-spacing:.5px;text-transform:uppercase;margin:2px 0 4px}.place-desc{font-size:12.5px;line-height:1.38;color:#516373}.place-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{background:#f2f7fa;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;color:#536675}.area-nav{position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(234,244,251,.97);backdrop-filter:blur(14px);border-top:1px solid rgba(74,111,135,.12);display:flex;gap:8px;overflow-x:auto;padding:8px max(12px,calc((100vw - 900px)/2 + 12px)) calc(8px + env(safe-area-inset-bottom));scrollbar-width:none}.area-nav button{flex:0 0 auto;border:1px solid #cfdfe9;background:#fff;color:#315268;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:720;white-space:nowrap}.area-nav button.active{background:#1d7d59;color:#fff;border-color:#1d7d59}
/* resources */
.resource-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-top:18px}.resource-card{background:#fff;border-radius:20px;padding:18px;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(35,72,95,.07);min-height:105px;display:flex;flex-direction:column;justify-content:center}.resource-card b{font-size:17px}.resource-card span{font-size:12px;color:var(--muted);margin-top:5px}.blank{background:#fff;border-radius:20px;padding:30px;text-align:center;color:var(--muted);box-shadow:0 6px 18px rgba(35,72,95,.07);margin-top:20px}
@media(max-width:700px){.page{padding:0 10px 26px}.plain-head{height:56px;grid-template-columns:48px 1fr 48px}.plain-head .title{font-size:15px}.home-title{font-size:29px;padding:20px 0 12px}.journey-stack{gap:10px;padding:0 10px 12px}.journey-card{flex-basis:calc(100vw - 20px);height:calc(100svh - 96px);min-height:560px;border-radius:22px}.journey-copy{left:22px;bottom:24px}.journey-copy h2{font-size:35px}.journey-copy p{font-size:16px}.area-strip{padding:6px 0 7px}.area-tile{flex-basis:91px}.area-photo{height:52px}.area-tile span{font-size:9px}.map-card{border-radius:17px}.base-card{height:126px;margin-top:8px}.base-copy{left:16px}.base-copy h3{font-size:18px}.base-copy p{font-size:11.5px;line-height:1.35;max-width:90%}.area-page{padding-bottom:78px}.cat-strip{top:56px;padding:6px 0 6px}.cat-tile{flex-basis:84px}.cat-photo{height:48px}.cat-tile span{font-size:8px}.cards{gap:8px;padding-top:8px}.place-card{grid-template-columns:104px minmax(0,1fr);min-height:128px;border-radius:16px}.place-media{min-height:128px;grid-template-columns:1fr;grid-template-rows:62% 38%}.place-media img:first-child{grid-row:auto}.place-media img:nth-child(3){display:none}.place-body{padding:10px 11px}.place-name{font-size:15px}.place-cat{font-size:8px;margin:1px 0 3px}.place-desc{font-size:11.5px;line-height:1.33}.place-meta{margin-top:6px}.pill{font-size:9px;padding:4px 7px}.area-nav{padding:6px 10px calc(6px + env(safe-area-inset-bottom))}.area-nav button{padding:6px 9px;font-size:9px}.resource-grid{grid-template-columns:1fr}}
@media(max-width:420px){#screen-paris .page{height:calc(100svh - 56px);overflow:hidden;display:flex;flex-direction:column}.area-strip{flex:0 0 74px}.map-card{flex:0 0 auto}.base-card{flex:0 0 118px}.map-card img{max-height:calc(100svh - 56px - 74px - 118px - 24px);object-fit:contain}}
</style></head><body>
<div id="app"></div>
<script>
const DATA={"areas":[{"slug":"loft","title":"Loft | Mouffetard","mapName":"Loft | Mouffetard","rep":"Rue Mouffetard Paris","items":[{"group":"major","name":"Panthéon","website":"https://www.paris-pantheon.fr/en/","maps":"https://maps.apple.com/?q=Panth%C3%A9on%20Paris","desc":"The great republican monument on the hill above the Loft: crypt, Foucault pendulum and an excellent way into the French idea of national memory. Close enough to be opportunistic rather than a major expedition.","category":"⌂ Major attraction","time":"60-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Panthéon Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Panthéon%20Paris"},{"group":"major","name":"Jardin des Plantes","website":"https://www.jardindesplantesdeparis.fr/en","maps":"https://maps.apple.com/?q=Jardin%20des%20Plantes%20Paris","desc":"Large historic botanical garden with glasshouses, galleries and plenty of outdoor space. Useful when you want Paris to feel green for an hour without making a special cross-city journey.","category":"⌂ Major attraction","time":"45-120 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Jardin des Plantes Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Jardin%20des%20Plantes%20Paris"},{"group":"activity","name":"Manufacture des Gobelins","website":"https://mobiliernational.culture.gouv.fr/fr/nous-connaitre/les-manufactures/manufacture-des-gobelins","maps":"https://maps.apple.com/?q=Manufacture%20des%20Gobelins%20Paris","desc":"A working tapestry manufacture with extraordinary traditional looms and craftspeople rather than a static museum. It is almost on the doorstep and particularly good if a guided workshop visit fits the day.","category":"◫ Craft / activity","time":"90 min","booking":"Yes","bookingLabel":"Reservation required","imageQuery":"Manufacture des Gobelins Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Manufacture%20des%20Gobelins%20Paris"},{"group":"activity","name":"Butte-aux-Cailles","website":"https://maps.apple.com/?q=Butte-aux-Cailles%20Paris","maps":"https://maps.apple.com/?q=Butte-aux-Cailles%20Paris","desc":"Village-like streets, cafés and street art south-east of the Loft. A useful 45-minute potter when you want atmosphere rather than another formal attraction.","category":"◫ Neighbourhood","time":"45-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Butte-aux-Cailles Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Butte-aux-Cailles%20Paris"},{"group":"treat","name":"Le Fournil de Mouffetard","website":"https://maps.apple.com/?q=Le%20Fournil%20de%20Mouffetard%20Paris","maps":"https://maps.apple.com/?q=Le%20Fournil%20de%20Mouffetard%20Paris","desc":"Primary Sunday breakfast expedition: a well-regarded bakery on Rue Mouffetard, good enough to make the walk part of breakfast rather than simply solving the croissant problem.","category":"○ Bakery","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Fournil de Mouffetard Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Fournil%20de%20Mouffetard%20Paris"},{"group":"treat","name":"La Gobelinoise","website":"https://maps.apple.com/?q=La%20Gobelinoise%20Paris","maps":"https://maps.apple.com/?q=La%20Gobelinoise%20Paris","desc":"The ultra-practical backup bakery on Avenue des Gobelins: very early opening and Sunday service make it the answer when somebody simply needs bread and pastries now.","category":"○ Bakery","time":"10 min","booking":"No","bookingLabel":"No reservation","imageQuery":"La Gobelinoise Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Gobelinoise%20Paris"},{"group":"treat","name":"Marché Monge","website":"https://www.paris.fr/lieux/marche-monge-5464","maps":"https://maps.apple.com/?q=March%C3%A9%20Monge%20Paris","desc":"Excellent Sunday-morning food market with fruit, cheese, prepared food and neighbourhood atmosphere. A very easy way to make breakfast/provisions feel like part of the holiday.","category":"○ Market","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Marché Monge Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Marché%20Monge%20Paris"},{"group":"treat","name":"Rue Mouffetard","website":"https://maps.apple.com/?q=Rue%20Mouffetard%20Paris","maps":"https://maps.apple.com/?q=Rue%20Mouffetard%20Paris","desc":"Classic market street rather than a single attraction: food shops, stalls, bakeries and small businesses running north towards the Latin Quarter. Best treated as a wandering route.","category":"○ Market","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Rue Mouffetard Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Rue%20Mouffetard%20Paris"},{"group":"treat","name":"Mococha","website":"https://maps.apple.com/?q=Mococha%20Rue%20Mouffetard%20Paris","maps":"https://maps.apple.com/?q=Mococha%20Paris","desc":"Small specialist chocolate and confectionery stop on Mouffetard. Exactly the sort of ten-minute edible side quest that can break up a walk without turning into another scheduled attraction.","category":"○ Treat","time":"10-15 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Mococha Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Mococha%20Paris"},{"group":"useful","name":"La P'tite Cave","website":"https://maps.apple.com/?q=La%20P%27tite%20Cave%20Paris","maps":"https://maps.apple.com/?q=La%20P%27tite%20Cave%20Paris","desc":"Neighbourhood wine shop close to the Loft, with the bonus of useful Sunday-morning opening. Good for something interesting to take back to the apartment without making wine-shopping a project.","category":"＋ Useful","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"La P'tite Cave Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20P'tite%20Cave%20Paris"},{"group":"useful","name":"Franprix / Glacière","website":"https://maps.apple.com/?q=Franprix%20Rue%20de%20la%20Glaciere%20Paris","maps":"https://maps.apple.com/?q=Franprix%20/%20Glaci%C3%A8re%20Paris","desc":"Simple emergency groceries close to the Loft, useful on Sunday and late in the day when the objective is milk, snacks or forgotten essentials rather than a French-food experience.","category":"＋ Useful","time":"10 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Franprix / Glacière Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Franprix%20/%20Glacière%20Paris"},{"group":"eat","name":"Le Vieux Bistrot","website":"https://maps.apple.com/?q=Le%20Vieux%20Bistrot%20Mouffetard%20Paris","maps":"https://maps.apple.com/?q=Le%20Vieux%20Bistrot%20Paris","desc":"A strong local safety-net: traditional French cooking on Mouffetard with broad, continuous service. This is the kind of place to use when everyone is hungry and you do not want dinner to become another planning exercise.","category":"⌁ Eat - flexible","time":"60-90 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Vieux Bistrot Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Vieux%20Bistrot%20Paris"},{"group":"eat","name":"Les Baux de Paris","website":"https://maps.apple.com/?q=Les%20Baux%20de%20Paris%20Rue%20Mouffetard","maps":"https://maps.apple.com/?q=Les%20Baux%20de%20Paris%20Paris","desc":"Well-regarded neighbourhood French restaurant on Mouffetard. More of a deliberate meal than a fallback, but still relaxed enough to feel like a local dinner rather than an occasion restaurant.","category":"⌁ Eat - proper","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Les Baux de Paris Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Les%20Baux%20de%20Paris%20Paris"},{"group":"eat","name":"La Crète","website":"https://maps.apple.com/?q=La%20Crete%20Rue%20Mouffetard%20Paris","maps":"https://maps.apple.com/?q=La%20Cr%C3%A8te%20Paris","desc":"Highly rated Greek option on Mouffetard and a useful palate-change after a lot of French food. Broadly family-safe without feeling like a compromise restaurant.","category":"⌁ Eat - different","time":"60-75 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"La Crète Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Crète%20Paris"},{"group":"eat","name":"Verse Toujours","website":"https://maps.apple.com/?q=Verse%20Toujours%20Paris","maps":"https://maps.apple.com/?q=Verse%20Toujours%20Paris","desc":"Long-hours neighbourhood brasserie at the bottom of Mouffetard. The important feature is operational: breakfast-to-late-night opening makes it a reliable 'food now' card.","category":"⌁ Eat - ultra-flexible","time":"45-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Verse Toujours Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Verse%20Toujours%20Paris"},{"group":"eat","name":"Le Mouffetard","website":"https://maps.apple.com/?q=Le%20Mouffetard%20brasserie%20Paris","maps":"https://maps.apple.com/?q=Le%20Mouffetard%20Paris","desc":"Historic neighbourhood brasserie with broad hours and continuous food service. Not necessarily a destination meal, but very useful when timing matters more than chasing the perfect restaurant.","category":"⌁ Eat - flexible","time":"45-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Mouffetard Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Mouffetard%20Paris"}]},{"slug":"latin","title":"Latin Quarter | Notre-Dame","mapName":"Latin Quarter | Notre-Dame","rep":"Notre Dame Paris","items":[{"group":"major","name":"Notre-Dame de Paris","website":"https://www.notredamedeparis.fr/en/","maps":"https://maps.apple.com/?q=Notre-Dame%20de%20Paris%20Paris","desc":"The obvious eastern anchor for Day 1. Entry is free and the rebuilt cathedral is worth seeing inside; a free timed reservation can reduce queue uncertainty without turning it into a rigid appointment.","category":"⌂ Major attraction","time":"30-60 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Notre-Dame de Paris Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Notre-Dame%20de%20Paris%20Paris"},{"group":"major","name":"Île Saint-Louis","website":"https://maps.apple.com/?q=Ile%20Saint-Louis%20Paris","maps":"https://maps.apple.com/?q=%C3%8Ele%20Saint-Louis%20Paris","desc":"Tiny island of handsome streets, food shops and river views immediately east of Notre-Dame. Worth walking through rather than merely looking at from a bridge.","category":"⌂ Major attraction","time":"30-45 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Île Saint-Louis Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Île%20Saint-Louis%20Paris"},{"group":"major","name":"Sorbonne / Latin Quarter","website":"https://maps.apple.com/?q=Sorbonne%20Paris","maps":"https://maps.apple.com/?q=Sorbonne%20/%20Latin%20Quarter%20Paris","desc":"Not one ticketed sight so much as the historic university quarter itself: steep streets, bookshops and student Paris. Best experienced as the connective tissue between the Loft and the Seine.","category":"⌂ Major attraction","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Sorbonne / Latin Quarter Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Sorbonne%20/%20Latin%20Quarter%20Paris"},{"group":"major","name":"Panthéon","website":"https://www.paris-pantheon.fr/en/","maps":"https://maps.apple.com/?q=Panth%C3%A9on%20Paris","desc":"Cross-reference from the Loft page: close enough to this axis that it can be added if enthusiasm and timing line up.","category":"⌂ Major attraction","time":"60-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Panthéon Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Panthéon%20Paris"},{"group":"craft","name":"Shakespeare and Company","website":"https://www.shakespeareandcompany.com/prepare-your-visit","maps":"https://maps.apple.com/?q=Shakespeare%20and%20Company%20Paris","desc":"Eccentric English-language bookshop opposite Notre-Dame. Famous and sometimes queued, but still exactly the right kind of 20-minute retail side quest for this itinerary.","category":"◇ Shop","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Shakespeare and Company Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Shakespeare%20and%20Company%20Paris"},{"group":"treat","name":"Berthillon","website":"https://www.berthillon.fr/","maps":"https://maps.apple.com/?q=Berthillon%20Paris","desc":"The classic Île Saint-Louis ice-cream name. Treat it as an opportunistic treat rather than a pilgrimage; if the original shop is shut or queued, plenty of nearby sellers carry the ice cream.","category":"○ Treat","time":"15-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Berthillon Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Berthillon%20Paris"},{"group":"activity","name":"Monnaie de Paris","website":"https://www.monnaiedeparis.fr/en","maps":"https://maps.apple.com/?q=Monnaie%20de%20Paris%20Paris","desc":"Historic mint on the Seine with coins, medals and metalworking. More tactile and specialised than another art museum, and the shop is good for unusual small objects and souvenirs.","category":"◫ History / craft","time":"60-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Monnaie de Paris Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Monnaie%20de%20Paris%20Paris"},{"group":"eat","name":"Le Petit Châtelet","website":"https://maps.apple.com/?q=Le%20Petit%20Chatelet%20Paris","maps":"https://maps.apple.com/?q=Le%20Petit%20Ch%C3%A2telet%20Paris","desc":"Tiny traditional French restaurant beside Shakespeare & Company. Geography is excellent without feeling like generic monument-frontage feeding; a strong deliberate lunch if the timing works.","category":"⌁ Eat - proper","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Le Petit Châtelet Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Petit%20Châtelet%20Paris"},{"group":"eat","name":"La Crème de Paris Notre-Dame","website":"https://maps.apple.com/?q=La%20Creme%20de%20Paris%20Notre%20Dame","maps":"https://maps.apple.com/?q=La%20Cr%C3%A8me%20de%20Paris%20Notre-Dame%20Paris","desc":"Crêpes, waffles and ice cream close to the cathedral. A deliberately easy Junior-friendly option when the immediate problem is morale and calories rather than achieving a memorable French lunch.","category":"⌁ Eat - quick","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"La Crème de Paris Notre-Dame Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Crème%20de%20Paris%20Notre-Dame%20Paris"},{"group":"eat","name":"Jardin Notre-Dame","website":"https://maps.apple.com/?q=Jardin%20Notre%20Dame%20restaurant%20Paris","maps":"https://maps.apple.com/?q=Jardin%20Notre-Dame%20Paris","desc":"Straightforward French restaurant south of the cathedral with broad hours. Keep it for operational flexibility rather than because it is the area's great culinary destination.","category":"⌁ Eat - flexible","time":"60-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Jardin Notre-Dame Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Jardin%20Notre-Dame%20Paris"},{"group":"eat","name":"La Rôtisserie d'Argent","website":"https://tourdargent.com/en/la-rotisserie-dargent/","maps":"https://maps.apple.com/?q=La%20R%C3%B4tisserie%20d%27Argent%20Paris","desc":"The serious nearby option: a genuine traditional restaurant beside one of Paris's biggest tourist magnets. Best used when you actually want a proper meal rather than a quick sightseeing lunch.","category":"⌁ Eat - proper","time":"90 min","booking":"Yes","bookingLabel":"Reservation required","imageQuery":"La Rôtisserie d'Argent Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Rôtisserie%20d'Argent%20Paris"},{"group":"eat","name":"Le Saint-Régis","website":"https://maps.apple.com/?q=Le%20Saint%20Regis%20Paris%20Ile%20Saint%20Louis","maps":"https://maps.apple.com/?q=Le%20Saint-R%C3%A9gis%20Paris","desc":"Attractive Île Saint-Louis brasserie with broad service hours. Useful when the island itself naturally becomes the lunch stop and you want something better than random tourist frontage.","category":"⌁ Eat - island","time":"60-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Saint-Régis Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Saint-Régis%20Paris"},{"group":"eat","name":"Les Fous de l'Île","website":"https://www.lesfousdelile.com/","maps":"https://maps.apple.com/?q=Les%20Fous%20de%20l%27%C3%8Ele%20Paris","desc":"More polished island option with a broad menu and relaxed format. A good middle ground between a quick brasserie and a formal lunch.","category":"⌁ Eat - island","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Les Fous de l'Île Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Les%20Fous%20de%20l'Île%20Paris"},{"group":"avoid","name":"Notre-Dame frontage roulette","website":"https://maps.apple.com/?q=Notre-Dame%20de%20Paris","maps":"https://maps.apple.com/?q=Notre-Dame%20frontage%20roulette%20Paris","desc":"Do not choose lunch solely because a restaurant is the first one visible from the cathedral or river. This area rewards walking five minutes sideways before committing.","category":"! Avoid","time":"-","booking":"-","bookingLabel":"-","imageQuery":"Notre-Dame frontage roulette Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Notre-Dame%20frontage%20roulette%20Paris"}]},{"slug":"left-bank","title":"Saint-Germain | Left Bank","mapName":"Saint-Germain | Left Bank","rep":"Jardin du Luxembourg Paris","items":[{"group":"major","name":"Jardin du Luxembourg","website":"https://jardin.senat.fr/","maps":"https://maps.apple.com/?q=Jardin%20du%20Luxembourg%20Paris","desc":"One of the great Paris gardens and a genuinely useful outdoor pause: lawns, chairs, fountains and enough activity to work for adults and children without becoming a formal visit.","category":"⌂ Major attraction","time":"45-90 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Jardin du Luxembourg Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Jardin%20du%20Luxembourg%20Paris"},{"group":"major","name":"Musée d'Orsay","website":"https://www.musee-orsay.fr/en","maps":"https://maps.apple.com/?q=Mus%C3%A9e%20d%27Orsay%20Paris","desc":"The obvious major museum on this side of the river. The building and concentrated Impressionist collection make it a better short-visit proposition than trying to conquer the Louvre.","category":"⌂ Major attraction","time":"90 min-3 hr","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Musée d'Orsay Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Musée%20d'Orsay%20Paris"},{"group":"craft","name":"Deyrolle","website":"https://www.deyrolle.com/","maps":"https://maps.apple.com/?q=Deyrolle%20Paris","desc":"Extraordinary historic natural-history and taxidermy shop: part shop, part cabinet of curiosities. One of the strongest non-attraction side quests in the whole directory; note that Sunday opening is the constraint.","category":"◇ Mad shop","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Deyrolle Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Deyrolle%20Paris"},{"group":"craft","name":"Sennelier","website":"https://www.magasinsennelier.art/en/","maps":"https://maps.apple.com/?q=Sennelier%20Paris","desc":"Historic artists' materials shop on Quai Voltaire, selling pigments, paints, papers and specialist materials. Beautiful, specific and worth fifteen minutes even if nobody needs an oil-paint set.","category":"◇ Craft / shop","time":"15-25 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Sennelier Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Sennelier%20Paris"},{"group":"craft","name":"La Grande Épicerie de Paris","website":"https://www.lagrandeepicerie.com/en/","maps":"https://maps.apple.com/?q=La%20Grande%20%C3%89picerie%20de%20Paris%20Paris","desc":"The mad food hall: cheese, pâtisserie, wine, groceries, charcuterie and expensive edible objects under one roof. Treat it as an attraction for people who like food, not just a supermarket.","category":"◇ Food shop","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"La Grande Épicerie de Paris Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Grande%20Épicerie%20de%20Paris%20Paris"},{"group":"treat","name":"Patrick Roger","website":"https://www.patrickroger.com/en/","maps":"https://maps.apple.com/?q=Patrick%20Roger%20Paris","desc":"Chocolate as sculpture. The displays and bold flavours make this feel closer to a tiny gallery visit than a conventional chocolatier, while still ending with something edible.","category":"○ Treat","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Patrick Roger Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Patrick%20Roger%20Paris"},{"group":"treat","name":"Le Chocolat Alain Ducasse","website":"https://www.lechocolat-alainducasse.com/en/","maps":"https://maps.apple.com/?q=Le%20Chocolat%20Alain%20Ducasse%20Paris","desc":"Serious bean-to-bar chocolate in a compact Saint-Germain counter. Less theatrical than Patrick Roger, but excellent if Senior wants to compare the proper grown-up chocolate options.","category":"○ Treat","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Chocolat Alain Ducasse Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Chocolat%20Alain%20Ducasse%20Paris"},{"group":"treat","name":"Pierre Hermé","website":"https://www.pierreherme.com/","maps":"https://maps.apple.com/?q=Pierre%20Herm%C3%A9%20Paris","desc":"Macarons and polished modern pâtisserie. Useful as a quick morale stop because you can buy one thing and move on rather than committing to a café session.","category":"○ Treat","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Pierre Hermé Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Pierre%20Hermé%20Paris"},{"group":"treat","name":"Poilâne","website":"https://www.poilane.com/en/","maps":"https://maps.apple.com/?q=Poil%C3%A2ne%20Paris","desc":"Historic wood-fired sourdough bakery on Rue du Cherche-Midi, still run as a serious craft bakery rather than a nostalgia set. Best if passing on Saturday; Sunday is the practical limitation.","category":"○ Bakery","time":"10-15 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Poilâne Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Poilâne%20Paris"},{"group":"treat","name":"La Dernière Goutte","website":"https://www.ladernieregoutte.net/","maps":"https://maps.apple.com/?q=La%20Derni%C3%A8re%20Goutte%20Paris","desc":"Excellent independent wine shop in Saint-Germain. Friendly enough for a quick bottle recommendation and useful because it does not require turning wine into a specialist expedition.","category":"○ Wine","time":"15-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"La Dernière Goutte Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Dernière%20Goutte%20Paris"},{"group":"eat","name":"Semilla","website":"https://semilla-paris.com/en/","maps":"https://maps.apple.com/?q=Semilla%20Paris","desc":"Serious contemporary French cooking on Rue de Seine without becoming ceremonial fine dining. A strong deliberate lunch or dinner when you want the food itself to matter.","category":"⌁ Eat - modern","time":"90-120 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Semilla Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Semilla%20Paris"},{"group":"eat","name":"La Jacobine","website":"https://maps.apple.com/?q=La%20Jacobine%20Paris","maps":"https://maps.apple.com/?q=La%20Jacobine%20Paris","desc":"Cosy classic French in the Cour du Commerce Saint-André: onion soup, confit and comfort-food territory. Particularly useful because lunch can stretch later than at many Paris restaurants.","category":"⌁ Eat - traditional","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"La Jacobine Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Jacobine%20Paris"},{"group":"eat","name":"La Boussole","website":"https://maps.apple.com/?q=La%20Boussole%20Paris%20restaurant","maps":"https://maps.apple.com/?q=La%20Boussole%20Paris","desc":"Well-regarded French restaurant near Saint-Sulpice with later lunch slots often available. A good compromise between proper food and a sightseeing day that refuses to run exactly on time.","category":"⌁ Eat - flexible","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"La Boussole Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Boussole%20Paris"},{"group":"eat","name":"Breizh Café","website":"https://www.breizhcafe.com/","maps":"https://maps.apple.com/?q=Breizh%20Caf%C3%A9%20Paris","desc":"Proper Breton galettes and crêpes rather than a children's-menu compromise. Very easy family lunch and a good reset if everyone wants something straightforward but still distinctly French.","category":"⌁ Eat - Junior-safe","time":"60-75 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Breizh Café Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Breizh%20Café%20Paris"},{"group":"eat","name":"Le Relais de l'Entrecôte","website":"https://www.relaisentrecote.fr/?page_id=208&lang=en","maps":"https://maps.apple.com/?q=Le%20Relais%20de%20l%27Entrec%C3%B4te%20Paris","desc":"The famous single-concept steak, sauce, fries and seconds. Fun if everybody actively wants that exact experience; the downside is the queue and complete lack of menu flexibility.","category":"⌁ Eat - experience","time":"75-90 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Relais de l'Entrecôte Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Relais%20de%20l'Entrecôte%20Paris"},{"group":"eat","name":"Brasserie Lipp","website":"https://www.brasserielipp.fr/en/","maps":"https://maps.apple.com/?q=Brasserie%20Lipp%20Paris","desc":"Historic brasserie saturated with French political and literary history. Senior may enjoy the roll-call of politicians and writers almost as much as the food; use it knowingly for atmosphere.","category":"⌁ Eat - historic","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Brasserie Lipp Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Brasserie%20Lipp%20Paris"},{"group":"treat","name":"Café de Flore","website":"https://cafedeflore.fr/","maps":"https://maps.apple.com/?q=Caf%C3%A9%20de%20Flore%20Paris","desc":"Iconic Saint-Germain terrace. Worth having coffee or a drink for the cultural theatre; no need to ask it to provide the best-value lunch of the holiday.","category":"○ Coffee / theatre","time":"20-40 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Café de Flore Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Café%20de%20Flore%20Paris"},{"group":"treat","name":"Les Deux Magots","website":"https://lesdeuxmagots.fr/en/","maps":"https://maps.apple.com/?q=Les%20Deux%20Magots%20Paris","desc":"Same principle as Flore: famous, historic and worth seeing, but best treated as a short atmospheric stop rather than an obligatory expensive meal.","category":"○ Coffee / theatre","time":"20-40 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Les Deux Magots Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Les%20Deux%20Magots%20Paris"}]},{"slug":"central","title":"Louvre | Opéra | Madeleine","mapName":"Louvre | Opéra | Madeleine","rep":"Louvre Pyramid Paris","items":[{"group":"major","name":"Louvre","website":"https://www.louvre.fr/en","maps":"https://maps.apple.com/?q=Louvre%20Paris","desc":"The major museum, but not a compulsory full-day project. The courtyard, pyramid and palace are valuable even if you decide the family does not need several hours inside.","category":"⌂ Major attraction","time":"30 min-4 hr","booking":"Yes if entering","bookingLabel":"Yes if entering","imageQuery":"Louvre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Louvre%20Paris"},{"group":"major","name":"Palais-Royal","website":"https://www.domaine-palais-royal.fr/en","maps":"https://maps.apple.com/?q=Palais-Royal%20Paris","desc":"Elegant courtyard, gardens and arcades beside the Louvre. Excellent decompression from the crowds and a natural base for several of the craft/shop side quests below.","category":"⌂ Major attraction","time":"20-40 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Palais-Royal Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Palais-Royal%20Paris"},{"group":"major","name":"Place Vendôme","website":"https://maps.apple.com/?q=Place%20Vendome%20Paris","maps":"https://maps.apple.com/?q=Place%20Vend%C3%B4me%20Paris","desc":"Grand formal square of jewellery houses and state history. Best as a ten-minute orientation stop while moving between Tuileries, Opéra and Madeleine.","category":"⌂ Major attraction","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Place Vendôme Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Place%20Vendôme%20Paris"},{"group":"craft","name":"Maison Fabre","website":"https://www.maisonfabre.com/en/","maps":"https://maps.apple.com/?q=Maison%20Fabre%20Paris","desc":"Historic French glove maker in the Palais-Royal arcades. Exactly the kind of living craft retail that is enjoyable to browse even if nobody arrives intending to buy gloves.","category":"◇ Craft / shop","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Maison Fabre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Maison%20Fabre%20Paris"},{"group":"craft","name":"Charvet","website":"https://www.charvet.com/","maps":"https://maps.apple.com/?q=Charvet%20Paris","desc":"Legendary Paris shirtmaker on Place Vendôme. More of a look at serious tailoring and fabric culture than a shopping requirement, but very much in the artisanal lane.","category":"◇ Craft / shop","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Charvet Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Charvet%20Paris"},{"group":"craft","name":"Moynat","website":"https://www.moynat.com/","maps":"https://maps.apple.com/?q=Moynat%20Paris","desc":"Historic French trunk and leather house with beautiful construction and materials. Less obvious than some luxury names and useful as a quick look at high-end leather craft.","category":"◇ Leather","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Moynat Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Moynat%20Paris"},{"group":"craft","name":"E. Dehillerin","website":"https://www.edehillerin.fr/en/stores","maps":"https://maps.apple.com/?q=E.%20Dehillerin%20Paris","desc":"Old-school professional cookware shop near Les Halles: copper pans, knives and restaurant equipment stacked with very little concession to luxury-retail theatre. Excellent weird-shop material.","category":"◇ Mad shop","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"E. Dehillerin Paris","ta":"https://www.tripadvisor.co.uk/Search?q=E.%20Dehillerin%20Paris"},{"group":"useful","name":"Galerie Vivienne","website":"https://maps.apple.com/?q=Galerie%20Vivienne%20Paris","maps":"https://maps.apple.com/?q=Galerie%20Vivienne%20Paris","desc":"Probably the prettiest covered passage: mosaic floors, books, shops and architecture. A perfect 20-minute detour that feels distinctively Parisian without requiring a ticket.","category":"＋ Passage","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Galerie Vivienne Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Galerie%20Vivienne%20Paris"},{"group":"useful","name":"Passage des Panoramas","website":"https://maps.apple.com/?q=Passage%20des%20Panoramas%20Paris","maps":"https://maps.apple.com/?q=Passage%20des%20Panoramas%20Paris","desc":"Older, denser and more eccentric than Vivienne, with restaurants, stamps and small shops. It naturally links the central-city walk towards Grands Boulevards and Montmartre.","category":"＋ Passage","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Passage des Panoramas Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Passage%20des%20Panoramas%20Paris"},{"group":"useful","name":"Passage Jouffroy","website":"https://maps.apple.com/?q=Passage%20Jouffroy%20Paris","maps":"https://maps.apple.com/?q=Passage%20Jouffroy%20Paris","desc":"Continuation north from Panoramas with toys, bookish shops and the Musée Grévin frontage. Best used as part of a passage chain rather than a standalone destination.","category":"＋ Passage","time":"15-25 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Passage Jouffroy Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Passage%20Jouffroy%20Paris"},{"group":"craft","name":"Fauchon Madeleine","website":"https://www.fauchon.com/en/","maps":"https://maps.apple.com/?q=Fauchon%20Madeleine%20Paris","desc":"The Hannibal Lecter literary side quest and a historic luxury épicerie name. Go for the association, packaging and edible oddities rather than expecting the largest food hall in Paris.","category":"◇ Food shop","time":"15-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Fauchon Madeleine Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Fauchon%20Madeleine%20Paris"},{"group":"treat","name":"À la Mère de Famille","website":"https://www.lameredefamille.com/en/","maps":"https://maps.apple.com/?q=%C3%80%20la%20M%C3%A8re%20de%20Famille%20Paris","desc":"Historic confectioner dating from the eighteenth century, with a wonderfully old-fashioned shop and lots of sweets and chocolate. One of the best family side quests on the Opéra-to-Montmartre axis.","category":"○ Treat","time":"15-25 min","booking":"No","bookingLabel":"No reservation","imageQuery":"À la Mère de Famille Paris","ta":"https://www.tripadvisor.co.uk/Search?q=À%20la%20Mère%20de%20Famille%20Paris"},{"group":"treat","name":"Angelina","website":"https://www.angelina-paris.fr/en/","maps":"https://maps.apple.com/?q=Angelina%20Paris","desc":"Famous Rivoli tearoom for hot chocolate and Mont-Blanc. Worth it if the queue looks sane; not worth sacrificing an hour of Paris merely to prove you have been.","category":"○ Treat","time":"30-45 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Angelina Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Angelina%20Paris"},{"group":"activity","name":"La Tête dans les Nuages","website":"https://latetedanslesnuages.com/","maps":"https://maps.apple.com/?q=La%20T%C3%AAte%20dans%20les%20Nuages%20Paris","desc":"Huge arcade/games venue and an excellent emergency card if Junior has reached the end of her cultural tolerance or the weather turns ugly. Not remotely subtle, which is part of the point.","category":"◫ Activity - Junior","time":"60-120 min","booking":"No","bookingLabel":"No reservation","imageQuery":"La Tête dans les Nuages Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Tête%20dans%20les%20Nuages%20Paris"},{"group":"eat","name":"Le Relais du Louvre","website":"https://maps.apple.com/?q=Le%20Relais%20du%20Louvre%20Paris%20restaurant","maps":"https://maps.apple.com/?q=Le%20Relais%20du%20Louvre%20Paris","desc":"Useful near-Louvre restaurant with broad hours and sensible positioning. A strong 'we are hungry here' option that avoids gambling on the first café facing the monument.","category":"⌁ Eat - flexible","time":"60-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Relais du Louvre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Relais%20du%20Louvre%20Paris"},{"group":"eat","name":"Le Louis","website":"https://maps.apple.com/?q=Le%20Louis%20Paris%20restaurant%201er","maps":"https://maps.apple.com/?q=Le%20Louis%20Paris","desc":"Small French restaurant north of Les Halles with a relatively forgiving Sunday lunch window. Good when you want a real meal without converting lunch into a two-hour event.","category":"⌁ Eat - proper","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Le Louis Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Louis%20Paris"},{"group":"eat","name":"Le Grand Colbert","website":"https://www.legrandcolbert.fr/en/","maps":"https://maps.apple.com/?q=Le%20Grand%20Colbert%20Paris","desc":"Glorious Belle-Époque brasserie interior near Galerie Vivienne. Choose it when Parisian brasserie atmosphere is part of what you are buying, not because you are chasing culinary novelty.","category":"⌁ Eat - atmosphere","time":"90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Le Grand Colbert Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Grand%20Colbert%20Paris"},{"group":"eat","name":"Bistrot Vivienne","website":"https://www.bistrotvivienne.com/en/","maps":"https://maps.apple.com/?q=Bistrot%20Vivienne%20Paris","desc":"Convenient brasserie woven directly into the covered-passages geography. Particularly useful when wandering rather than reservations is driving the day.","category":"⌁ Eat - flexible","time":"60-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Bistrot Vivienne Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Bistrot%20Vivienne%20Paris"},{"group":"treat","name":"Le Nemours","website":"https://maps.apple.com/?q=Le%20Nemours%20Paris","maps":"https://maps.apple.com/?q=Le%20Nemours%20Paris","desc":"Small Palais-Royal corner café that is ideal for coffee and people-watching. A good example of paying a little for famous geography without asking it to carry a whole meal.","category":"○ Coffee","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Le Nemours Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Nemours%20Paris"},{"group":"avoid","name":"Café Marly as default lunch","website":"https://cafe-marly.com/en/","maps":"https://maps.apple.com/?q=Caf%C3%A9%20Marly%20as%20default%20lunch%20Paris","desc":"The Louvre view is spectacular, but the setting is what you are paying for. Use it only if sitting under the arcades looking at the pyramid is itself the objective.","category":"! Avoid","time":"-","booking":"-","bookingLabel":"-","imageQuery":"Café Marly as default lunch Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Café%20Marly%20as%20default%20lunch%20Paris"}]},{"slug":"west","title":"Champs | Eiffel | Bois de Boulogne","mapName":"Champs | Eiffel | Bois de Boulogne","rep":"Eiffel Tower Paris","items":[{"group":"major","name":"Champs-Élysées","website":"https://maps.apple.com/?q=Avenue%20des%20Champs-Elysees%20Paris","maps":"https://maps.apple.com/?q=Champs-%C3%89lys%C3%A9es%20Paris","desc":"The famous avenue is principally an axis for this trip: walk some of it, use Sephora, see the Arc, then move sideways for food rather than treating every frontage as a recommendation.","category":"⌂ Major attraction","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Champs-Élysées Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Champs-Élysées%20Paris"},{"group":"major","name":"Arc de Triomphe","website":"https://www.paris-arc-de-triomphe.fr/en/","maps":"https://maps.apple.com/?q=Arc%20de%20Triomphe%20Paris","desc":"Strong western anchor for Day 1. The rooftop is genuinely worthwhile if weather and legs cooperate, but the monument still works as an exterior/underpass stop if the day is already long.","category":"⌂ Major attraction","time":"45-75 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Arc de Triomphe Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Arc%20de%20Triomphe%20Paris"},{"group":"major","name":"Eiffel Tower","website":"https://www.toureiffel.paris/en","maps":"https://maps.apple.com/?q=Eiffel%20Tower%20Paris","desc":"An icon rather than an obligation to ascend. Trocadéro and Champ de Mars views may be enough; if you do want the tower itself, pre-book because spontaneous ticket queues can consume the evening.","category":"⌂ Major attraction","time":"30 min-2 hr","booking":"Yes if ascending","bookingLabel":"Yes if ascending","imageQuery":"Eiffel Tower Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Eiffel%20Tower%20Paris"},{"group":"major","name":"Trocadéro","website":"https://maps.apple.com/?q=Trocadero%20Paris","maps":"https://maps.apple.com/?q=Trocad%C3%A9ro%20Paris","desc":"The classic broad view of the Eiffel Tower and a useful place to decide whether the family still wants more sightseeing or simply wants food/boat/home.","category":"⌂ Major attraction","time":"20-40 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Trocadéro Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Trocadéro%20Paris"},{"group":"major","name":"Invalides","website":"https://www.musee-armee.fr/en/english-version.html","maps":"https://maps.apple.com/?q=Invalides%20Paris","desc":"Major military/state complex founded by Louis XIV. The value for this family is the history of French power well beyond Napoleon: monarchy, Revolution, republic, world wars and de Gaulle.","category":"⌂ Major attraction","time":"60 min-3 hr","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Invalides Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Invalides%20Paris"},{"group":"major","name":"Place de la Concorde","website":"https://maps.apple.com/?q=Place%20de%20la%20Concorde%20Paris","maps":"https://maps.apple.com/?q=Place%20de%20la%20Concorde%20Paris","desc":"Central piece of the east-west axis and a compact way into Revolution, monarchy and modern state symbolism. Better as a ten-minute historical pause than a formal visit.","category":"⌂ Major attraction","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Place de la Concorde Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Place%20de%20la%20Concorde%20Paris"},{"group":"major","name":"Palais de l'Élysée","website":"https://www.elysee.fr/en/","maps":"https://maps.apple.com/?q=Palais%20de%20l%27%C3%89lys%C3%A9e%20Paris","desc":"The presidential palace is mainly exterior/political geography on an ordinary weekend. For Senior, the surrounding Faubourg Saint-Honoré and Place Beauvau make the French state feel physically real.","category":"⌂ Major attraction","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Palais de l'Élysée Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Palais%20de%20l'Élysée%20Paris"},{"group":"activity","name":"Maison Élysée","website":"https://www.elysee.fr/en/maison-elysee","maps":"https://maps.apple.com/?q=Maison%20%C3%89lys%C3%A9e%20Paris","desc":"Presidency-themed exhibition, café and shop opposite the Élysée. A wonderfully specific Senior side quest combining politics, French-made products and official-state merchandising.","category":"◫ Politics / shop","time":"20-40 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Maison Élysée Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Maison%20Élysée%20Paris"},{"group":"craft","name":"Sephora Champs-Élysées","website":"https://www.sephora.fr/information-magasin/?storeID=S5391","maps":"https://maps.apple.com/?q=Sephora%20Champs-%C3%89lys%C3%A9es%20Paris","desc":"The correct Sephora for Junior: the flagship on the avenue, huge enough to make the shop itself part of the experience and directly on the Day 1 route.","category":"◇ Shop - Junior","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Sephora Champs-Élysées Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Sephora%20Champs-Élysées%20Paris"},{"group":"craft","name":"Boutique Talents / Ateliers d'Art de France","website":"https://www.ateliersdart.com/","maps":"https://maps.apple.com/?q=Boutique%20Talents%20/%20Ateliers%20d%27Art%20de%20France%20Paris","desc":"Curated French artisan pieces - jewellery, ceramics, leather and small-batch objects - near the Arc/Ternes area. A more attainable way to see contemporary craft than luxury-house browsing.","category":"◇ Craft / shop","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Boutique Talents / Ateliers d'Art de France Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Boutique%20Talents%20/%20Ateliers%20d'Art%20de%20France%20Paris"},{"group":"activity","name":"Bateaux-Mouches","website":"https://www.bateaux-mouches.fr/en/cruise/information","maps":"https://maps.apple.com/?q=Bateaux-Mouches%20Paris","desc":"Best used as tired-leg theatre rather than transport: one hour on the Seine, ideally late afternoon or dusk, with everyone outside looking at Paris instead of concentrating on the commentary.","category":"◫ Boat","time":"1 hr","booking":"Buy ahead","bookingLabel":"Buy ahead","imageQuery":"Bateaux-Mouches Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Bateaux-Mouches%20Paris"},{"group":"activity","name":"Bateaux Parisiens","website":"https://www.bateauxparisiens.com/en.html","maps":"https://maps.apple.com/?q=Bateaux%20Parisiens%20Paris","desc":"Eiffel-foot alternative to Bateaux-Mouches. Useful if you reach the western end of Day 1 and want the boat immediately without adding another transfer.","category":"◫ Boat","time":"1 hr","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Bateaux Parisiens Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Bateaux%20Parisiens%20Paris"},{"group":"eat","name":"Chez Pippo","website":"https://www.chezpippo.com/","maps":"https://maps.apple.com/?q=Chez%20Pippo%20Paris","desc":"Italian near the Eiffel Tower with broad continuous hours. Pizza and pasta make it a very strong tactical family option when everyone is done with sightseeing and wants food without ceremony.","category":"⌁ Eat - flexible","time":"60-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Chez Pippo Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Chez%20Pippo%20Paris"},{"group":"eat","name":"Riviera Fuga","website":"https://fugafamily.com/restaurants/riviera-fuga","maps":"https://maps.apple.com/?q=Riviera%20Fuga%20Paris","desc":"Restaurant on the Seine at Port des Invalides. Stylish and unusual enough that the setting contributes to the experience, while still being more playful than another grand brasserie.","category":"⌁ Eat - experience","time":"90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Riviera Fuga Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Riviera%20Fuga%20Paris"},{"group":"eat","name":"Francette","website":"https://www.fugafamily.com/restaurants/francette","maps":"https://maps.apple.com/?q=Francette%20Paris","desc":"Floating restaurant at Port de Suffren beside the Eiffel Tower. Particularly useful as a flexible endpoint to a long walking day because the river setting feels like part of the sightseeing.","category":"⌁ Eat - setting","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Francette Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Francette%20Paris"},{"group":"avoid","name":"Random Champs/Eiffel frontage","website":"https://maps.apple.com/?q=Eiffel%20Tower%20Paris","maps":"https://maps.apple.com/?q=Random%20Champs/Eiffel%20frontage%20Paris","desc":"The avenue and tower approaches are excellent for sights, but poor places to choose a restaurant solely by what is directly in front of you. Walk a few minutes sideways first.","category":"! Avoid","time":"-","booking":"-","bookingLabel":"-","imageQuery":"Random Champs/Eiffel frontage Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Random%20Champs/Eiffel%20frontage%20Paris"},{"group":"major","name":"Jardin d'Acclimatation","website":"https://www.jardindacclimatation.fr/en/plan-your-visit","maps":"https://maps.apple.com/?q=Jardin%20d%27Acclimatation%20Paris","desc":"Prater-lite is the right mental model: rides, games and family attractions embedded in a landscaped park. This is here because it lets Junior actually do things, not because the itinerary needs more nature.","category":"⌂ Major attraction","time":"2-4 hr","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Jardin d'Acclimatation Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Jardin%20d'Acclimatation%20Paris"},{"group":"activity","name":"Entry + selected rides","website":"https://www.jardindacclimatation.fr/en/billetterie","maps":"https://maps.apple.com/?q=Entry%20%2B%20selected%20rides%20Paris","desc":"The lighter version of Jardin d'Acclimatation if you do not want to surrender half a day: enter, pick a handful of rides, have a wander and leave while it is still fun.","category":"◫ Activity","time":"60-120 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Entry + selected rides Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Entry%20+%20selected%20rides%20Paris"}]},{"slug":"north","title":"Montmartre | Saint-Denis","mapName":"Montmartre | Saint-Denis","rep":"Sacre Coeur Paris","items":[{"group":"major","name":"Sacré-Cœur","website":"https://www.sacre-coeur-montmartre.com/english/","maps":"https://maps.apple.com/?q=Sacr%C3%A9-C%C5%93ur%20Paris","desc":"The obvious hilltop anchor, with the panorama doing as much work as the basilica itself. Do not let Sacré-Cœur become the whole of Montmartre; the streets around it are the real point.","category":"⌂ Major attraction","time":"30-45 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Sacré-Cœur Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Sacré-Cœur%20Paris"},{"group":"major","name":"Montmartre","website":"https://maps.apple.com/?q=Montmartre%20Paris","maps":"https://maps.apple.com/?q=Montmartre%20Paris","desc":"The neighbourhood itself is the attraction: steep streets, stairs, shops, cafés and changing views. Build time for wandering rather than hopping directly between named sights.","category":"⌂ Major attraction","time":"60-120 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Montmartre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Montmartre%20Paris"},{"group":"major","name":"Place du Tertre","website":"https://maps.apple.com/?q=Place%20du%20Tertre%20Paris","maps":"https://maps.apple.com/?q=Place%20du%20Tertre%20Paris","desc":"Artist-filled square near Sacré-Cœur. Enjoy the theatre and people-watching, but treat the restaurant frontage with caution and consult the food options below before sitting down.","category":"⌂ Major attraction","time":"15-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Place du Tertre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Place%20du%20Tertre%20Paris"},{"group":"major","name":"Moulin Rouge","website":"https://www.moulinrouge.fr/?lang=en","maps":"https://maps.apple.com/?q=Moulin%20Rouge%20Paris","desc":"Iconic Pigalle exterior and useful orientation landmark. Unless you specifically want the show, this is a quick look rather than an evening commitment.","category":"⌂ Major attraction","time":"10-15 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Moulin Rouge Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Moulin%20Rouge%20Paris"},{"group":"activity","name":"Musée de Montmartre","website":"https://museedemontmartre.fr/en/","maps":"https://maps.apple.com/?q=Mus%C3%A9e%20de%20Montmartre%20Paris","desc":"Small neighbourhood museum and Renoir gardens that explain the artistic village without requiring the scale or energy of a major museum. Particularly good if Montmartre itself has caught everyone's interest.","category":"◫ Museum / garden","time":"60-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Musée de Montmartre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Musée%20de%20Montmartre%20Paris"},{"group":"activity","name":"Abbesses - Lepic - upper Montmartre","website":"https://maps.apple.com/?q=Abbesses%20Paris","maps":"https://maps.apple.com/?q=Abbesses%20-%20Lepic%20-%20upper%20Montmartre%20Paris","desc":"A route rather than a sight: start around Abbesses and Rue Lepic, then work uphill through shops and streets. This is the best antidote to treating Montmartre as one photo at Sacré-Cœur.","category":"◫ Walk","time":"60-90 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Abbesses - Lepic - upper Montmartre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Abbesses%20-%20Lepic%20-%20upper%20Montmartre%20Paris"},{"group":"craft","name":"Halle Saint-Pierre","website":"https://www.hallesaintpierre.org/","maps":"https://maps.apple.com/?q=Halle%20Saint-Pierre%20Paris","desc":"Outsider and popular-art centre below Sacré-Cœur with an unusually good specialist bookshop. Excellent if Senior wants something odd and Junior is bored by conventional galleries.","category":"◇ Mad shop / art","time":"30-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Halle Saint-Pierre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Halle%20Saint-Pierre%20Paris"},{"group":"treat","name":"Sébastien Gaudard - Rue des Martyrs","website":"https://www.sebastiengaudard.com/","maps":"https://maps.apple.com/?q=S%C3%A9bastien%20Gaudard%20-%20Rue%20des%20Martyrs%20Paris","desc":"Elegant classic pâtisserie on the natural route between Grands Boulevards/Pigalle and Montmartre. A high-quality morale stop rather than an attraction that needs scheduling.","category":"○ Treat","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Sébastien Gaudard - Rue des Martyrs Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Sébastien%20Gaudard%20-%20Rue%20des%20Martyrs%20Paris"},{"group":"treat","name":"À la Mère de Famille","website":"https://www.lameredefamille.com/en/","maps":"https://maps.apple.com/?q=%C3%80%20la%20M%C3%A8re%20de%20Famille%20Paris","desc":"Cross-reference from the Opéra page: historic confectioner on the natural approach to Montmartre, and probably one of the easiest family side quests to say yes to.","category":"○ Treat","time":"15-25 min","booking":"No","bookingLabel":"No reservation","imageQuery":"À la Mère de Famille Paris","ta":"https://www.tripadvisor.co.uk/Search?q=À%20la%20Mère%20de%20Famille%20Paris"},{"group":"treat","name":"Rose Bakery - Rue des Martyrs","website":"https://www.rosebakery.fr/","maps":"https://maps.apple.com/?q=Rose%20Bakery%20-%20Rue%20des%20Martyrs%20Paris","desc":"Easy café/tea-room stop on the Martyrs axis. Best when you want something lighter than a full French restaurant and the day's timing is deliberately loose.","category":"○ Coffee / light food","time":"45-60 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Rose Bakery - Rue des Martyrs Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Rose%20Bakery%20-%20Rue%20des%20Martyrs%20Paris"},{"group":"eat","name":"Le Poulbot","website":"https://www.lepoulbot.fr/","maps":"https://maps.apple.com/?q=Le%20Poulbot%20Paris","desc":"One of the strongest Montmartre finds: proper French food right in the neighbourhood with broad continuous service. A very good default when you want quality without timing anxiety.","category":"⌁ Eat - proper/flexible","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Le Poulbot Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Le%20Poulbot%20Paris"},{"group":"eat","name":"L'Annexe Montmartre","website":"https://maps.apple.com/?q=L%27Annexe%20Montmartre%20Paris","maps":"https://maps.apple.com/?q=L%27Annexe%20Montmartre%20Paris","desc":"Small highly rated French restaurant on Rue des Trois Frères. Better for a deliberate meal than a late-lunch fallback, so use it when the day's timing is behaving.","category":"⌁ Eat - proper","time":"90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"L'Annexe Montmartre Paris","ta":"https://www.tripadvisor.co.uk/Search?q=L'Annexe%20Montmartre%20Paris"},{"group":"eat","name":"Gavroche","website":"https://parisgavroche.com/en/","maps":"https://maps.apple.com/?q=Gavroche%20Paris","desc":"Near Sacré-Cœur with uninterrupted service, making it useful insurance on a day when Montmartre wandering can easily push lunch later than intended.","category":"⌁ Eat - flexible","time":"60-90 min","booking":"No / Recommended","bookingLabel":"No / Recommended","imageQuery":"Gavroche Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Gavroche%20Paris"},{"group":"eat","name":"Bouillon Pigalle","website":"https://bouillonlesite.com/en/bouillon-pigalle","maps":"https://maps.apple.com/?q=Bouillon%20Pigalle%20Paris","desc":"Big, noisy, inexpensive bouillon with traditional dishes and lots of energy. Junior-compatible and deliberately unprecious; an excellent reset if everyone wants to sit down now.","category":"⌁ Eat - cheap/fun","time":"60-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Bouillon Pigalle Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Bouillon%20Pigalle%20Paris"},{"group":"eat","name":"La Boîte aux Lettres","website":"https://maps.apple.com/?q=La%20Boite%20aux%20Lettres%20Rue%20Lepic%20Paris","maps":"https://maps.apple.com/?q=La%20Bo%C3%AEte%20aux%20Lettres%20Paris","desc":"Rue Lepic restaurant with broad hours and good geography for the actual wandering route. Useful when you want something more intimate than Bouillon Pigalle without needing a formal booking.","category":"⌁ Eat - flexible","time":"60-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"La Boîte aux Lettres Paris","ta":"https://www.tripadvisor.co.uk/Search?q=La%20Boîte%20aux%20Lettres%20Paris"},{"group":"avoid","name":"Place du Tertre restaurant roulette","website":"https://maps.apple.com/?q=Place%20du%20Tertre%20Paris","maps":"https://maps.apple.com/?q=Place%20du%20Tertre%20restaurant%20roulette%20Paris","desc":"The square is worth seeing; choosing the first restaurant because it occupies the square is a separate decision. Enjoy the artists, then use the directory before sitting down.","category":"! Avoid","time":"-","booking":"-","bookingLabel":"-","imageQuery":"Place du Tertre restaurant roulette Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Place%20du%20Tertre%20restaurant%20roulette%20Paris"},{"group":"major","name":"Basilique Cathédrale Saint-Denis","website":"https://www.saint-denis-basilique.fr/en/","maps":"https://maps.apple.com/?q=Basilique%20Cath%C3%A9drale%20Saint-Denis%20Paris","desc":"The royal necropolis and one of the best history stops for this family: Capetian succession, dynastic marriages, Revolution, restoration and a physical map of who actually ruled France.","category":"⌂ Major attraction","time":"75-120 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Basilique Cathédrale Saint-Denis Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Basilique%20Cathédrale%20Saint-Denis%20Paris"},{"group":"activity","name":"Royal tomb sequence","website":"https://www.saint-denis-basilique.fr/en/discover","maps":"https://maps.apple.com/?q=Royal%20tomb%20sequence%20Paris","desc":"Use the tombs as a succession map rather than simply reading labels: which premature deaths, marriages, disputed heirs or restored lines changed France, and where plausible alternate histories branch.","category":"◫ History / alt-history","time":"Within visit","booking":"No","bookingLabel":"No reservation","imageQuery":"Royal tomb sequence Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Royal%20tomb%20sequence%20Paris"}]},{"slug":"marais","title":"Marais | Bastille","mapName":"Marais | Bastille","rep":"Place des Vosges Paris","items":[{"group":"major","name":"Place des Vosges","website":"https://maps.apple.com/?q=Place%20des%20Vosges%20Paris","maps":"https://maps.apple.com/?q=Place%20des%20Vosges%20Paris","desc":"Beautiful seventeenth-century square and a very easy reason to wander into the Marais. The arcades and small garden work well as a pause rather than a formal visit.","category":"⌂ Major attraction","time":"20-40 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Place des Vosges Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Place%20des%20Vosges%20Paris"},{"group":"major","name":"Musée Carnavalet","website":"https://www.carnavalet.paris.fr/en","maps":"https://maps.apple.com/?q=Mus%C3%A9e%20Carnavalet%20Paris","desc":"Excellent museum of Paris itself, housed in historic mansions. A strong rainy-day/history option because the subject is the city you are actually walking through.","category":"⌂ Major attraction","time":"60-120 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Musée Carnavalet Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Musée%20Carnavalet%20Paris"},{"group":"treat","name":"Marché des Enfants Rouges","website":"https://www.paris.fr/lieux/marche-couvert-des-enfants-rouges-5461","maps":"https://maps.apple.com/?q=March%C3%A9%20des%20Enfants%20Rouges%20Paris","desc":"Paris's oldest covered market: produce plus small food counters and international lunch options. Works as both a market side quest and a flexible meal rather than a restaurant booking.","category":"○ Market / food","time":"45-90 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Marché des Enfants Rouges Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Marché%20des%20Enfants%20Rouges%20Paris"},{"group":"treat","name":"Edwart Chocolatier - Marais","website":"https://edwart.fr/en/","maps":"https://maps.apple.com/?q=Edwart%20Chocolatier%20-%20Marais%20Paris","desc":"Small artisan chocolatier with imaginative flavours and a less corporate feel than the grand luxury houses. Good for a quick comparison stop in a district already full of retail temptation.","category":"○ Treat","time":"10-20 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Edwart Chocolatier - Marais Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Edwart%20Chocolatier%20-%20Marais%20Paris"},{"group":"craft","name":"Merci","website":"https://merci-merci.com/en","maps":"https://maps.apple.com/?q=Merci%20Paris","desc":"Large concept store mixing design, homewares, fashion and café culture. A modern counterpart to the historic craft shops elsewhere in the directory.","category":"◇ Shop","time":"30-45 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Merci Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Merci%20Paris"},{"group":"craft","name":"Bonton","website":"https://www.bonton.fr/en","maps":"https://maps.apple.com/?q=Bonton%20Paris","desc":"Children's concept store with clothes, objects and playful retail presentation. More interesting than generic kids' shopping and a plausible Junior side quest if you are already in the Marais.","category":"◇ Shop - Junior","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Bonton Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Bonton%20Paris"},{"group":"activity","name":"Musée de la Chasse et de la Nature","website":"https://www.chassenature.org/en","maps":"https://maps.apple.com/?q=Mus%C3%A9e%20de%20la%20Chasse%20et%20de%20la%20Nature%20Paris","desc":"Art, animals and natural history presented with deliberate eccentricity. Much more likely to hold family attention than a conventional gallery and very much in the Deyrolle-adjacent universe.","category":"◫ Mad museum","time":"60-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Musée de la Chasse et de la Nature Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Musée%20de%20la%20Chasse%20et%20de%20la%20Nature%20Paris"},{"group":"treat","name":"Marché des Enfants Rouges counters","website":"https://www.paris.fr/lieux/marche-couvert-des-enfants-rouges-5461","maps":"https://maps.apple.com/?q=March%C3%A9%20des%20Enfants%20Rouges%20counters%20Paris","desc":"Best if everyone wants different things or timing is awkward: choose from market counters rather than committing to a single restaurant and keep the whole stop casual.","category":"○ Eat - market","time":"45-75 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Marché des Enfants Rouges counters Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Marché%20des%20Enfants%20Rouges%20counters%20Paris"},{"group":"eat","name":"Breizh Café Marais","website":"https://www.breizhcafe.com/","maps":"https://maps.apple.com/?q=Breizh%20Caf%C3%A9%20Marais%20Paris","desc":"Cross-reference to the Saint-Germain favourite: galettes and crêpes are an easy family choice, and the Marais branch can rescue the geography without changing the concept.","category":"⌁ Eat - Junior-safe","time":"60-75 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Breizh Café Marais Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Breizh%20Café%20Marais%20Paris"},{"group":"eat","name":"Chez Janou","website":"https://www.chezjanou.com/","maps":"https://maps.apple.com/?q=Chez%20Janou%20Paris","desc":"Busy Provençal-style bistro by Place des Vosges, famous for its enormous chocolate mousse. Fun and atmospheric, but popular enough that booking is sensible.","category":"⌁ Eat - classic","time":"75-90 min","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"Chez Janou Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Chez%20Janou%20Paris"}]},{"slug":"across","title":"Across Paris","mapName":"Across Paris","rep":"Paris artisan shop","items":[{"group":"activity","name":"Galerie du 19M","website":"https://www.le19m.com/en","maps":"https://maps.apple.com/?q=Galerie%20du%2019M%20Paris","desc":"Chanel-backed centre for métiers d'art: embroidery, featherwork, millinery and specialist craft. Exhibitions and workshops vary, but the point is seeing high-level making rather than merely finished luxury goods.","category":"◫ Craft / activity","time":"60-120 min","booking":"Depends","bookingLabel":"Check / depends","imageQuery":"Galerie du 19M Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Galerie%20du%2019M%20Paris"},{"group":"activity","name":"Pigeon Coq leather workshop","website":"https://www.pigeoncoq.com/","maps":"https://maps.apple.com/?q=Pigeon%20Coq%20leather%20workshop%20Paris","desc":"Hands-on leatherworking where you can make a belt, bag or small accessory. A proper 'do something' craft option if a workshop slot fits rather than another passive shop visit.","category":"◫ Craft / activity","time":"2-4 hr","booking":"Yes","bookingLabel":"Reservation required","imageQuery":"Pigeon Coq leather workshop Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Pigeon%20Coq%20leather%20workshop%20Paris"},{"group":"craft","name":"L'Écritoire","website":"https://www.lecritoireparis.com/","maps":"https://maps.apple.com/?q=L%27%C3%89critoire%20Paris","desc":"Stationery rabbit hole with pens, inks, paper, sealing wax and - crucially - proper seals. This is now a Senior-specific target rather than a generic stationery shop.","category":"◇ Mad shop / Senior","time":"20-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"L'Écritoire Paris","ta":"https://www.tripadvisor.co.uk/Search?q=L'Écritoire%20Paris"},{"group":"craft","name":"Maison Duvelleroy","website":"https://www.duvelleroy.fr/en","maps":"https://maps.apple.com/?q=Maison%20Duvelleroy%20Paris","desc":"Historic Paris fan-maker and a surviving specialist craft house. Excellent for a short look at materials, handwork and an object category that almost never gets its own shop anymore.","category":"◇ Craft / shop","time":"15-30 min","booking":"No","bookingLabel":"No reservation","imageQuery":"Maison Duvelleroy Paris","ta":"https://www.tripadvisor.co.uk/Search?q=Maison%20Duvelleroy%20Paris"},{"group":"useful","name":"One complete sightseeing-bus circuit","website":"https://www.bigbustours.com/en/paris/paris-routes-and-tour-maps","maps":"https://maps.apple.com/?q=One%20complete%20sightseeing-bus%20circuit%20Paris","desc":"Tacky only if you pretend it is not. A full upstairs circuit can be a very efficient two-hour mental map of Paris when everyone needs a sit-down or the weather is mediocre.","category":"＋ Orientation","time":"~2 hr","booking":"Recommended","bookingLabel":"Reservation recommended","imageQuery":"One complete sightseeing-bus circuit Paris","ta":"https://www.tripadvisor.co.uk/Search?q=One%20complete%20sightseeing-bus%20circuit%20Paris"}]}],"resources":[{"name":"G7 Taxi Taxi ›","url":"https://www.g7.fr/"},{"name":"TheFork Restaurants & bookings ›","url":"https://www.thefork.com/"},{"name":"Citymapper Getting around Paris ›","url":"https://citymapper.com/paris"},{"name":"Île-de-France Mobilités Official public transport ›","url":"https://www.iledefrance-mobilites.fr/en"},{"name":"Affluences Live crowding / waiting ›","url":"https://affluences.com/"}],"homeCards":[{"key":"paris","title":"Paris","subtitle":"August 22nd-25th","query":"Eiffel Tower Paris Seine"},{"key":"normandy","title":"Normandy","subtitle":"August 25th-29th","query":"Normandy coast France"},{"key":"resources","title":"Resources","subtitle":"Paris travel apps & useful links","query":"Paris metro station"},{"key":"itinerary","title":"Itinerary","subtitle":"Coming next","query":"Paris map notebook travel"}],"catOrder":["major","activity","craft","treat","eat","useful","avoid"],"catNames":{"major":"Major attractions","activity":"Activities & history","craft":"Craft & shops","treat":"Treats & food shops","eat":"Eat","useful":"Useful","avoid":"Avoid"},"mapSrc":"data:image/webp;base64,UklGRiDIAQBXRUJQVlA4IBTIAQCQeQWdASrYA3ECPjEWiUOiISETGTWoIAMEsqGL7oIGHbHEEItvBvxLdc69uZFB/34+nZnP5V/m85DmHxc+0/lPVq/tdent3/Y8yHq35wPmt/3PVx/Tf+R/8fz4+g39l/+v/m/8V2XP309S39l/7X7ce7b6b/7X/8fYd/on+7/8HZPeij+5nrAfm18SH9V/8v7ve1v/4/YA9c7n9+Wf4ye7r5T/Vf678kv2v9hfyb7H/Of4b/M/63/Df+n/ffLfoD9h/wP+z/rf3S9zf5d+EPzP+D/z/+v/vn/t/233I/tv+5/rPI35of7H+j/dj/c/sp9hH5N/Ov8r/c/25/vX7T/aF+L/6f9n4He+/8f/2f7T2CPZj69/sv8h/mv9//kP2n+jn7H/Z/6j
